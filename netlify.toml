[build]
  command = "npm run build"
  publish = "build"
  # Skip deploys when only the daily or practice puzzles changed: the app fetches them from GitHub at runtime
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!public/puzzle/puzzle.json' ':!public/practice'"

[build.environment]
  NODE_VERSION = "24"
